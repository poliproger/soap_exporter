# Kerberos configuration for soap_exporter (gokrb5), mounted at /etc/krb5.conf.
# It is read once, when the first configuration with a Kerberos target is loaded:
# changes take effect after a restart, not on a reload. include and includedir are not
# followed; keep everything in this file.

[libdefaults]
  default_realm = CORP.EXAMPLE
  # List the KDCs below instead of looking them up in DNS (SRV records).
  dns_lookup_kdc = false
  dns_lookup_realm = false
  # Always use TCP: Active Directory tickets carry a PAC and often exceed a UDP datagram.
  udp_preference_limit = 1

[realms]
  CORP.EXAMPLE = {
    kdc = dc01.corp.example
    kdc = dc02.corp.example
  }

[domain_realm]
  .corp.example = CORP.EXAMPLE
  corp.example = CORP.EXAMPLE
