version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /test/kdc, /test/e2e/mocksoap]
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
