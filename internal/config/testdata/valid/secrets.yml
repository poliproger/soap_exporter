# Every kind of inline secret of the standard HTTP client config. Redacted must hide all of
# them; each value contains "s3cret" so that a leak is easy to find.
defaults:
  http_headers:
    X-Api-Key:
      secrets: [header-s3cret-1]
targets:
  - name: basic
    url: https://basic.example.com/Service.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
    basic_auth:
      username: monitor
      password: basic-s3cret-2
    tls_config:
      cert: |
        -----BEGIN CERTIFICATE-----
        not-a-certificate
        -----END CERTIFICATE-----
      key: tls-key-s3cret-3

  - name: authorization
    url: https://authorization.example.com/Service.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
    authorization:
      type: Token
      credentials: authorization-s3cret-4

  - name: bearer
    url: https://bearer.example.com/Service.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
    bearer_token: bearer-s3cret-5

  - name: oauth2
    url: https://oauth2.example.com/Service.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
    oauth2:
      client_id: monitor
      client_secret: oauth2-s3cret-6
      token_url: https://sso.example.com/token
    proxy_url: http://proxy-user:proxy-s3cret-7@proxy.example.com:3128
    proxy_connect_header:
      Proxy-Authorization: [proxy-header-s3cret-8]
