# want: target "orders": url: must be an absolute http or https URL
# reject: s3cret
# Without "//", url.Parse reads "monitor" as the scheme and does not see the user info.
targets:
  - name: orders
    url: monitor:s3cret@orders.corp.example/Orders.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
