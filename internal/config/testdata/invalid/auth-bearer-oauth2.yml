# want: target "orders": at most one auth method may be set, found bearer_token, oauth2
# reject: s3cret
targets:
  - name: orders
    url: https://orders.corp.example/Orders.svc
    body: '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>'
    bearer_token: s3cret
    oauth2:
      client_id: monitor
      token_url: https://sso.corp.example/token
