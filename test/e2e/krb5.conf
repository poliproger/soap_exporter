# Kerberos configuration of the exporter in the end-to-end smoke test, mounted at
# /etc/krb5.conf as in examples/docker-compose.yml. The KDC is the compose service kdc.

[libdefaults]
  default_realm = CORP.EXAMPLE
  dns_lookup_kdc = false
  dns_lookup_realm = false
  # Always TCP, as recommended for Active Directory.
  udp_preference_limit = 1

[realms]
  CORP.EXAMPLE = {
    kdc = kdc:88
  }
